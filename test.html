<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI Study Assistant</h1>
            <p>Learn Smarter. Revise Faster.</p>
        </div>

        <div class="panel">
            <label for="question">What are you studying today?</label>
            <textarea
                id="question"
                placeholder="Enter a topic or paste your study notes..."
                rows="7"
            ></textarea>

            <label for="mode">Choose a study mode</label>
            <select id="mode">
                <option value="explain">Explain</option>
                <option value="summarize">Summarize</option>
                <option value="quiz">Quiz</option>
                <option value="flashcards">Flashcards</option>
            </select>

            <button id="askBtn">Generate</button>
        </div>

        <div class="panel">
            <h2 class="result-heading">Your study results</h2>
            <p id="result">Your generated explanation, summary, quiz, or flashcards will appear here.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/contrib/auto-render.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
